# XcodeGen definition of the app target. Generate with `xcodegen generate`; Takt.xcodeproj is not checked in.
name: Takt

options:
  bundleIdPrefix: de.nilslutz
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.6.1 # x-release-please-version
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages:
  TaktKit:
    path: Packages/TaktKit

targets:
  Takt:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: TaktKit
        product: TaktUI
      - package: TaktKit
        product: TaktCore
      - package: TaktKit
        product: TaktStore
      - package: TaktKit
        product: TaktSystem
      - package: TaktKit
        product: TaktAnalytics
      - package: TaktKit
        product: TaktADO
      # The command line tool (#189), signed with the app and linked into the PATH from the settings.
      - target: takt-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Takt
        PRODUCT_BUNDLE_IDENTIFIER: de.nilslutz.takt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Takt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Nils Lutz. MIT License."
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

  takt-cli:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: TaktKit
        product: TaktCLI
    settings:
      base:
        PRODUCT_NAME: takt
        # One file with `@main`; without the flag Swift treats it as a script.
        OTHER_SWIFT_FLAGS: -parse-as-library
        PRODUCT_BUNDLE_IDENTIFIER: de.nilslutz.takt.cli
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
