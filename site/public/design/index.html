<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takt – UI-Entwürfe</title>
<link rel="icon" href="../favicon.png">
<style>
:root {
  --bg: #F6F6F8;
  --card: #FFFFFF;
  --ink: #1C1C1E;
  --muted: #55555A;
  --line: #E5E5EA;
  --accent: #0F766E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618;
    --card: #222225;
    --ink: #F5F5F7;
    --muted: #AEAEB2;
    --line: #3A3A3C;
    --accent: #5EEAD4;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
header, main { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 40px; padding-bottom: 8px; }
h1 { margin: 0 0 4px; font-size: 28px; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
a { color: var(--accent); }
h2 { font-size: 18px; margin: 36px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.frame { position: relative; overflow: hidden; background: #E4E7EC; }
.frame iframe {
  position: absolute;
  top: 0;
  left: 0;
  border: 0;
  transform-origin: 0 0;
  pointer-events: none;
}
.card footer { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; font-size: 14px; }
.card footer a { white-space: nowrap; }
.note { color: var(--muted); font-size: 13px; margin: 32px 0 48px; }
</style>
</head>
<body>
<header>
  <h1>Takt – UI-Entwürfe</h1>
  <p>
    Schreibgeschützter Snapshot des
    <a href="https://claude.ai/artifact/FeiQaPoKc5FuezMenGZ9Kh">Design-Canvas</a>.
    Bearbeitet wird im Canvas; verbindliche Regeln stehen in
    <a href="https://github.com/nimble-123/takt/blob/main/docs/DESIGN.md">docs/DESIGN.md</a>.
  </p>
</header>
<main id="boards"></main>
<main><p class="note">Vereinfacht gerendert: Interaktionen und Animationen des Canvas fehlen hier.</p></main>
<script>
(async () => {
  const main = document.getElementById('boards');
  const canvas = await (await fetch('canvas.json')).json();
  // Rows of the canvas, each headed by the nearest title above it.
  const titles = Object.values(canvas.notes || {})
    .filter((note) => note.kind === 'title1')
    .sort((a, b) => a.y - b.y);
  const sectionOf = (board) => titles.filter((title) => title.y < board.y).at(-1)?.text ?? '';
  const boards = canvas.order
    .map((file) => ({ file, ...canvas.boards[file] }))
    .filter((board) => board.title)
    .sort((a, b) => a.y - b.y || a.x - b.x);

  let grid;
  let current;
  for (const board of boards) {
    const section = sectionOf(board);
    if (section !== current) {
      current = section;
      const heading = document.createElement('h2');
      heading.textContent = section;
      grid = document.createElement('div');
      grid.className = 'grid';
      main.append(heading, grid);
    }
    const card = document.createElement('article');
    card.className = 'card';
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.style.aspectRatio = `${board.w} / ${board.h}`;
    const iframe = document.createElement('iframe');
    iframe.src = board.file;
    iframe.loading = 'lazy';
    iframe.title = board.title;
    iframe.tabIndex = -1;
    iframe.width = board.w;
    iframe.height = board.h;
    frame.append(iframe);
    const footer = document.createElement('footer');
    const name = document.createElement('span');
    name.textContent = board.title;
    const open = document.createElement('a');
    open.href = board.file;
    open.textContent = 'Öffnen';
    open.setAttribute('aria-label', `${board.title} öffnen`);
    footer.append(name, open);
    card.append(frame, footer);
    grid.append(card);
    new ResizeObserver(() => {
      iframe.style.transform = `scale(${frame.clientWidth / board.w})`;
    }).observe(frame);
  }
})();
</script>
</body>
</html>
