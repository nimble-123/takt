.tb:hover{background:#ECECF0}
.btn{height:26px;padding:0 10px;border:1px solid #D9D9DE;border-radius:6px;background:#FFFFFF;font-size:12px;white-space:nowrap}
.btn-p{height:28px;padding:0 14px;border:0;border-radius:7px;background:#0F766E;color:#FFFFFF;font-weight:600;white-space:nowrap}
.ctl{height:26px;border:1px solid #D9D9DE;border-radius:6px;background:#FFFFFF;padding:0 6px;font:inherit;font-size:13px;color:#1C1C1E;min-width:0}
.ghost{height:26px;padding:0 4px;border:0;background:transparent;color:#0F766E}
.grp-h{margin:0 0 6px 10px;font-size:13px;font-weight:600;color:#1C1C1E}
.grp{background:#FFFFFF;border:1px solid #E5E5EA;border-radius:9px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 12px;box-sizing:border-box;border-top:1px solid #F0F0F3}
.row:first-child{border-top:0}
.row>.lbl{flex:1;min-width:0}
.cap{margin:6px 10px 0;font-size:11px;line-height:1.45;color:#55555A}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
input.sw{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:9px;background:#D9D9DE;position:relative;margin:0;flex:none;cursor:pointer}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
input.sw:checked{background:#0F766E}input.sw:checked::after{transform:translateX(12px)}
input.sw:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:#ECECF0;gap:2px}
.seg button{height:22px;padding:0 10px;border:0;border-radius:5px;background:transparent;font-size:12px}
.seg button[aria-pressed=true]{background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
</style>

<div style="display: flex; gap: 8px; margin-right: 6px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tb" aria-label="Zurück"><svg class="i" width="14" height="14" aria-hidden="true"><use href="#i-left"></use></svg></button>

<div style="font-size: 15px; font-weight: 700; white-space: nowrap">Dienstag, 6. Oktober 2026</div>
<div style="flex: 1"></div>

<label style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; background: #F1F1F4; color: #6E6E73; width: 300px; box-sizing: border-box; border: 1px solid #0F766E">

<sc-for list="{{entries}}" as="e" hint-placeholder-count="4">
<a href="Today.dc.html" style="display: flex; align-items: baseline; gap: 12px; padding: 7px 10px; border-radius: 7px; color: #1C1C1E; text-decoration: none; background: {{e.bg}}">
<span style="width: 110px; flex: none; color: #55555A; font-variant-numeric: tabular-nums">{{e.date}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span>{{e.title}}</span>
<span style="font-size: 11px; color: #55555A; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{e.pre}}<strong style="color: #1C1C1E">{{e.hit}}</strong>{{e.post}}</span>
</span>
<span style="font-variant-numeric: tabular-nums">{{e.dur}}</span>
</a>
</sc-for>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="margin: 14px 10px 4px; font-size: 11px; font-weight: 600; color: #55555A">{{g.title}}</h2>
<sc-for list="{{g.hits}}" as="h" hint-placeholder-count="2">
<a href="#" style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: #1C1C1E; text-decoration: none">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span>{{h.title}}</span>
<sc-if value="{{h.hasSnippet}}" hint-placeholder-val="{{true}}"><span style="font-size: 11px; color: #55555A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.pre}}<strong style="color: #1C1C1E">{{h.hit}}</strong>{{h.post}}</span></sc-if>
</span>
</a>
</sc-for>
</sc-for>
</div>
</main>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (text) => { const p = text.split('**'); return { pre: p[0] || '', hit: p[1] || '', post: p[2] || '', hasSnippet: !!text }; };
    const entry = (date, title, snippet, dur, hover) => Object.assign({ date: date, title: title, dur: dur, bg: hover ? '#F1F1F4' : 'transparent' }, s(snippet));
    const hit = (title, snippet) => Object.assign({ title: title }, s(snippet || ''));
    return {
      entries: [
        entry('Di., 6. Okt. 2026', '#4821 Login-Flow refaktorieren', 'Token-Refresh aus dem **Login**-Controller herausgelöst', '3:40', true),
        entry('Mo., 5. Okt. 2026', '#4821 Login-Flow refaktorieren', '**Login**-Formular auf die neue Validierung umgestellt', '3:45'),
        entry('Mo., 5. Okt. 2026', '#4790 SSO-Login-Bug', 'SSO-**Login** schlägt nach Token-Ablauf fehl, Repro im Staging gefunden', '2:15'),
        entry('Do., 1. Okt. 2026', 'Pairing mit Jana', 'Flaky **Login**-Tests stabilisiert', '1:10')
      ],
      groups: [
        { title: 'Work Items', icon: 'link', hits: [
          hit('#4821 Login-Flow refaktorieren', 'Refactoring des **Login**-Flows im Kundenportal'),
          hit('#4790 SSO-Login schlägt bei Token-Ablauf fehl', 'Nach Ablauf des Tokens landet der **Login** in einer Schleife')
        ] },
        { title: 'Tasks', icon: 'checklist', hits: [hit('Login')] },
        { title: 'Tags', icon: 'hash', hits: [hit('login')] }
      ]
    };
  }
}
</script>
