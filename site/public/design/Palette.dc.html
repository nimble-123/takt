<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Takt – Befehlspalette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb.s{width:24px;height:24px}
a{color:#0F766E}a:hover{color:#115E59}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #0F766E;outline-offset:1px}
kbd{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;color:#555559;background:#FFFFFF;border:1px solid #D9D9DE;border-radius:5px;padding:1px 5px}
input[type=checkbox]{accent-color:#0F766E;width:16px;height:16px;margin:0;flex:none}
.side{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:#1C1C1E;text-decoration:none}
.side svg{color:#55555A;flex:none}
.side:hover{background:#ECECF0;color:#1C1C1E}
.side[aria-current=page]{background:#E2E8E7;font-weight:600}
.side[aria-current=page] svg{color:#0F766E}
.tb{width:30px;height:30px;border:0;border-radius:7px;background:transparent;display:flex;align-items:center;justify-content:center;color:#55555A;padding:0}
.tb:hover{background:#ECECF0}
.btn{height:26px;padding:0 10px;border:1px solid #D9D9DE;border-radius:6px;background:#FFFFFF;font-size:12px;white-space:nowrap}
.btn-p{height:28px;padding:0 14px;border:0;border-radius:7px;background:#0F766E;color:#FFFFFF;font-weight:600;white-space:nowrap}
.ctl{height:26px;border:1px solid #D9D9DE;border-radius:6px;background:#FFFFFF;padding:0 6px;font:inherit;font-size:13px;color:#1C1C1E;min-width:0}
.ghost{height:26px;padding:0 4px;border:0;background:transparent;color:#0F766E}
.grp-h{margin:0 0 6px 10px;font-size:13px;font-weight:600;color:#1C1C1E}
.grp{background:#FFFFFF;border:1px solid #E5E5EA;border-radius:9px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:38px;padding:6px 12px;box-sizing:border-box;border-top:1px solid #F0F0F3}
.row:first-child{border-top:0}
.row>.lbl{flex:1;min-width:0}
.cap{margin:6px 10px 0;font-size:11px;line-height:1.45;color:#55555A}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
input.sw{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:9px;background:#D9D9DE;position:relative;margin:0;flex:none;cursor:pointer}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
input.sw:checked{background:#0F766E}input.sw:checked::after{transform:translateX(12px)}
input.sw:disabled{opacity:.55;cursor:default}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:#ECECF0;gap:2px}
.seg button{height:22px;padding:0 10px;border:0;border-radius:5px;background:transparent;font-size:12px}
.seg button[aria-pressed=true]{background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; box-sizing: border-box; padding: 24px; background: #E4E7EC; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #1C1C1E; font-size: 13px">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><symbol id="i-pausec" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"></circle><path d="M6.6 5.8v4.4M9.4 5.8v4.4"></path></symbol><symbol id="i-playc" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"></circle><path d="M6.7 5.6l3.6 2.4-3.6 2.4z"></path></symbol><symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"></circle><path d="M8 4.6V8l2.3 1.4"></path></symbol><symbol id="i-link" viewBox="0 0 16 16"><path d="M6.8 9.2a2.6 2.6 0 003.7 0l2.2-2.2a2.6 2.6 0 00-3.7-3.7l-.8.8"></path><path d="M9.2 6.8a2.6 2.6 0 00-3.7 0L3.3 9a2.6 2.6 0 003.7 3.7l.8-.8"></path></symbol><symbol id="i-cmd" viewBox="0 0 16 16"><path d="M6 6V4.4A1.6 1.6 0 104.4 6H6zm0 0h4m-4 0v4m4-4V4.4A1.6 1.6 0 1111.6 6H10zm0 0v4m0 0h1.6a1.6 1.6 0 11-1.6 1.6V10zm0 0H6m0 0v1.6A1.6 1.6 0 114.4 10H6z"></path></symbol><symbol id="i-left" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"></path></symbol><symbol id="i-right" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"></path></symbol><symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.8"></circle><path d="M10.6 10.6L14 14"></path></symbol><symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"></path></symbol><symbol id="i-insp" viewBox="0 0 16 16"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"></rect><path d="M10 2.5v11"></path></symbol><symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8"></circle><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"></path></symbol><symbol id="i-seal" viewBox="0 0 16 16"><path d="M8 1.6l1.6 1.2 2-.1.6 1.9 1.6 1.2-.7 1.9.7 1.9-1.6 1.2-.6 1.9-2-.1L8 14.4l-1.6-1.2-2 .1-.6-1.9-1.6-1.2.7-1.9-.7-1.9 1.6-1.2.6-1.9 2 .1z"></path><path d="M5.8 8.1l1.5 1.5 3-3.1"></path></symbol><symbol id="i-cal" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2"></rect><path d="M2 6.5h12M5.5 1.6v2.6M10.5 1.6v2.6"></path></symbol><symbol id="i-list" viewBox="0 0 16 16"><path d="M6 4h8M6 8h8M6 12h8"></path><circle cx="2.8" cy="4" r=".6"></circle><circle cx="2.8" cy="8" r=".6"></circle><circle cx="2.8" cy="12" r=".6"></circle></symbol><symbol id="i-chart" viewBox="0 0 16 16"><path d="M2 2v12h12"></path><path d="M5.5 11V8M8.5 11V5M11.5 11V7"></path></symbol><symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.2c0-.7.5-1.2 1.2-1.2h3l1.4 1.5H13c.7 0 1.2.5 1.2 1.2v6.1c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z"></path></symbol><symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"></path><circle cx="8" cy="8" r="4.6"></circle></symbol></defs></svg>
<div style="position: relative; max-width: 1232px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.16); overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 52px; padding: 8px 16px; border-bottom: 1px solid #ECECF0; background: #FAFAFB">
<div style="display: flex; gap: 8px; margin-right: 6px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<div style="display: flex; align-items: center; gap: 2px">
<button type="button" class="tb" aria-label="Zurück"><svg class="i" width="14" height="14" aria-hidden="true"><use href="#i-left"></use></svg></button>
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #D9D9DE; border-radius: 7px; background: #FFFFFF">Heute</button>
<button type="button" class="tb" aria-label="Weiter"><svg class="i" width="14" height="14" aria-hidden="true"><use href="#i-right"></use></svg></button>
</div>
<div style="font-size: 15px; font-weight: 700; white-space: nowrap">Dienstag, 6. Oktober 2026</div>
<div style="flex: 1"></div>

<label style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; background: #F1F1F4; color: #6E6E73; width: 300px; box-sizing: border-box; border: 1px solid transparent">
<svg class="i" width="13" height="13" aria-hidden="true" style="color: #6E6E73; stroke-width: 1.6"><use href="#i-search"></use></svg>
<input type="search" aria-label="Suchen" placeholder="Einträge, Notizen, Projekte, Work Items" style="border: 0; background: transparent; font: inherit; color: #1C1C1E; outline: none; min-width: 0; flex: 1">

</label>
<button type="button" class="tb" aria-label="Neuer Eintrag" title="Neuer Eintrag (⌘N)"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-plus"></use></svg></button>
<button type="button" class="tb" aria-label="Inspektor" title="Inspektor (⌥⌘I)"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-insp"></use></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap">
<nav aria-label="Bereiche" style="flex: 0 0 200px; box-sizing: border-box; padding: 16px 10px; background: #F6F6F8; border-right: 1px solid #ECECF0; display: flex; flex-direction: column; gap: 2px; min-height: 720px">
<a class="side" href="Today.dc.html" aria-current="page"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-sun"></use></svg>Heute</a>
<a class="side" href="DayClose.dc.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-seal"></use></svg>Tagesabschluss</a>
<a class="side" href="Week.dc.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-cal"></use></svg>Woche</a>
<a class="side" href="Entries.dc.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-list"></use></svg>Einträge</a>
<a class="side" href="Analytics.dc.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-chart"></use></svg>Analysen</a>
<a class="side" href="Catalog.dc.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-folder"></use></svg>Projekte</a>
<a class="side" href="Settings.dc.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="#i-gear"></use></svg>Einstellungen</a>
</nav>
<main aria-hidden="true" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px 20px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
<div style="padding: 10px 14px; border-radius: 10px; background: #F6F6F8; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: #55555A">{{k.label}}</span>
<span class="mono" style="font-size: 22px; font-weight: 600">{{k.value}}</span>
</div>
</sc-for>
</div>
<div style="height: 1px; background: #ECECF0"></div>
<div style="display: flex; gap: 8px; padding: 12px 16px 24px 8px">
<div class="mono" style="width: 44px; position: relative; height: 540px; flex: none; font-size: 11px; color: #55555A">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="10">
<span style="position: absolute; top: {{h.top}}px; right: 0; transform: translateY(-50%)">{{h.label}}</span>
</sc-for>
</div>
<div style="flex: 1; position: relative; height: 540px; border-left: 1px solid #ECECF0">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="10">
<div style="position: absolute; left: 0; right: 0; top: {{h.top}}px; border-top: 1px solid #F0F0F3"></div>
</sc-for>
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="6">
<div style="position: absolute; top: {{b.top}}px; height: {{b.h}}px; left: 0; right: 0; box-sizing: border-box; margin: 1px 4px; padding: 3px 8px; border-radius: 6px; background: {{b.bg}}; color: {{b.ink}}; font-size: 12px; font-weight: 600; overflow: hidden">{{b.title}}</div>
</sc-for>
</div>
</div>
</main>
</div>
<div style="position: absolute; inset: 0; background: rgba(28,28,30,0.22); display: flex; justify-content: center; align-items: flex-start; padding: 64px 16px 16px">
<div role="dialog" aria-modal="true" aria-label="Befehlspalette" style="width: 520px; max-width: 100%; background: #FFFFFF; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); box-shadow: 0 24px 60px rgba(0,0,0,0.28); overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 14px">
<svg class="i" width="16" height="16" aria-hidden="true" style="color: #55555A"><use href="#i-cmd"></use></svg>
<input type="text" aria-label="Befehlspalette" placeholder="Befehl oder Suche eingeben" value="Pause" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: #1C1C1E">
</div>
<div style="height: 1px; background: #ECECF0"></div>
<div role="listbox" aria-label="Ergebnisse" style="height: 320px; overflow-y: auto; padding: 6px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="7">
<div role="option" aria-selected="{{it.selected}}" tabindex="-1" style="display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 3px 10px; box-sizing: border-box; border-radius: 6px; background: {{it.bg}}; cursor: pointer">
<svg class="i" width="16" height="16" aria-hidden="true" style="color: {{it.iconInk}}; width: 20px"><use href="#i-{{it.icon}}"></use></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
<sc-if value="{{it.subtitle}}" hint-placeholder-val="{{true}}"><span style="font-size: 11px; color: #55555A">{{it.subtitle}}</span></sc-if>
</div>
<sc-if value="{{it.shortcut}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #55555A">{{it.shortcut}}</span></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const hours = [];
    for (let i = 0; i <= 9; i++) hours.push({ label: String(8 + i).padStart(2, '0') + ':00', top: i * 60 });
    const dev = { bg: '#DBEAFE', ink: '#1E3A8A' }, meet = { bg: '#FFEDD5', ink: '#7C2D12' }, rev = { bg: '#EDE9FE', ink: '#4C1D95' };
    const b = (s, top, h, title) => Object.assign({}, s, { top: top, h: h, title: title });
    const item = (icon, title, subtitle, shortcut, selected) => ({
      icon: icon, title: title, subtitle: subtitle || '', shortcut: shortcut || '', selected: selected ? 'true' : 'false',
      bg: selected ? '#E8F4F2' : 'transparent', iconInk: selected ? '#0F766E' : '#55555A'
    });
    return {
      hours: hours,
      kpis: [{ label: 'Erfasst', value: '7:02' }, { label: 'Pausen', value: '1:08' }, { label: 'Einträge', value: '8' }],
      blocks: [
        b(dev, 30, 75, '#4821 Login-Flow refaktorieren'), b(meet, 105, 15, 'Daily Stand-up'),
        b(dev, 120, 120, '#4821 Login-Flow refaktorieren'), b(dev, 285, 56, '#4790 SSO-Login-Bug'),
        b(dev, 364, 86, '#4790 SSO-Login-Bug'), b(rev, 450, 45, 'Code-Review')
      ],
      items: [
        item('pausec', 'Alle pausieren oder fortsetzen', '', '⌥⇧P', true),
        item('playc', 'Timer „Pause“ starten', '', '↩'),
        item('clock', 'Mittagspause', '6. Okt. 2026'),
        item('clock', 'Mittagspause', '5. Okt. 2026'),
        item('clock', 'Pausenregel mit dem Team abstimmen', '1. Okt. 2026'),
        item('link', 'Pausen-Erkennung im Idle-Dialog', 'Timer für #4955 starten'),
        item('link', 'Pause-Button im Popover ohne Fokus', 'Timer für #4961 starten')
      ]
    };
  }
}
</script>
</body>
</html>
