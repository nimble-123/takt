<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Takt – Überstunden vergüten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0F766E}a:hover{color:#115E59}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
kbd{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;color:#555559;background:#FFFFFF;border:1px solid #D9D9DE;border-radius:5px;padding:1px 5px}
</style>
</helmet>
<div style="width: 760px; height: 420px; box-sizing: border-box; padding: 24px; background: #E4E7EC; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #1C1C1E; font-size: 13px; display: flex; gap: 24px; align-items: flex-start">
<div style="flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px">
<div style="padding: 14px; border-radius: 10px; background: #F6F6F8; border: 2px solid #0F766E; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #55555A">Flexkonto</span>
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">+12:30 h</span>
<span style="font-size: 12px; color: #55555A">Quartal: 10:00 von 40:00 vergütet · noch 30:00</span>
</div>
<section aria-label="Vergütungen" style="background: #FFFFFF; border-radius: 10px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.16); padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700">Flexkonto</h2>
<sc-for list="{{payouts}}" as="p" hint-placeholder-count="2">
<div style="display: grid; grid-template-columns: 76px 44px 1fr 24px; gap: 10px; align-items: center">
<span style="font-variant-numeric: tabular-nums">{{p.day}}</span>
<span style="font-family: 'SF Mono', ui-monospace, Menlo, monospace; text-align: right">{{p.hours}}</span>
<span style="color: #55555A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.note}}</span>
<button type="button" aria-label="Vergütung entfernen" style="width: 24px; height: 24px; border: 0; background: transparent; padding: 0; color: #55555A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"></path></svg></button>
</div>
</sc-for>
<button type="button" style="align-self: flex-start; height: 26px; padding: 0 10px; border: 1px solid #D9D9DE; border-radius: 6px; background: #FFFFFF">Überstunden vergüten …</button>
</section>
</div>
<section aria-labelledby="sheet-title" style="flex: 1; background: #FFFFFF; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.2); padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 id="sheet-title" style="margin: 0; font-size: 13px; font-weight: 700">Überstunden vergüten</h2>
<label style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Stunden</span><input type="text" inputmode="decimal" value="35" style="width: 56px; height: 24px; box-sizing: border-box; border: 1px solid #D9D9DE; border-radius: 6px; padding: 0 6px; text-align: right; font-variant-numeric: tabular-nums"><span style="color: #55555A">h</span></label>
<label style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Datum</span><input type="date" value="2026-10-31" style="height: 24px; box-sizing: border-box; border: 1px solid #D9D9DE; border-radius: 6px; padding: 0 6px"></label>
<label style="display: flex; align-items: center; gap: 8px"><span style="flex: 1">Notiz (optional)</span><input type="text" value="Abrechnung Oktober" style="width: 180px; height: 24px; box-sizing: border-box; border: 1px solid #D9D9DE; border-radius: 6px; padding: 0 6px"></label>
<div role="status" style="display: flex; flex-direction: column; gap: 6px; color: #B45309">
<span style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5 14 13.5H2Z"></path><path d="M8 6.5v3M8 11.5v.01"></path></svg>Überschreitet das Quartalskontingent um 5:00.</span>
</div>
<div style="flex: 1"></div>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="height: 28px; padding: 0 14px; border: 1px solid #D9D9DE; border-radius: 7px; background: #FFFFFF">Abbrechen</button>
<button type="button" style="height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: #0F766E; color: #FFFFFF; font-weight: 600">Vergüten <kbd style="background: transparent; color: #FFFFFF; border-color: rgba(255,255,255,0.5)">⌘↩</kbd></button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      payouts: [
        { day: '31.07.2026', hours: '6:00', note: 'Abrechnung Juli' },
        { day: '15.10.2026', hours: '10:00', note: 'Projektabschluss' }
      ]
    };
  }
}
</script>
</body>
</html>
