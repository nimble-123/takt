<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 616" width="928" height="616" role="img" aria-labelledby="arch-light-title arch-light-desc">
<title id="arch-light-title">Takt module architecture</title>
<desc id="arch-light-desc">Layered modules: the app uses TaktUI, which uses TaktSystem, TaktAnalytics, TaktCalendar and TaktADO; the services use TaktStore and TaktCore; dependencies only point downwards. TaktADO talks to Azure DevOps.</desc>
