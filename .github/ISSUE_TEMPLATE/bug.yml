name: Fehler
description: Etwas funktioniert nicht wie erwartet
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Was passiert?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was sollte passieren?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Takt-Version und macOS-Version
      placeholder: z. B. 0.3.1 auf macOS 26.1
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Aus der Konsole, Subsystem de.nilslutz.takt. Keine Tokens oder privaten Notizen einfügen.
      render: text
