name: Release-Build

# Baut die unsignierte Apple-Silicon-App (scripts/package-unsigned.sh).
# - Release-PRs von release-please: nur bauen und packen, als Check vor dem Release.
# - PRs, die das Packen ändern (Skript, scripts/dmg/, dieser Workflow): ebenso nur bauen und packen.
# - Veröffentlichtes Release: bauen, packen und DMG/ZIP an das Release hängen.
#   Startet nur, wenn release-please mit RELEASE_PLEASE_TOKEN arbeitet (siehe docs/RELEASING.md).
# - Manuell: für ein bestehendes Tag neu bauen und hochladen.
# Nach dem Upload aktualisiert der Job „Homebrew-Tap“ den Cask in nimble-123/homebrew-tap.

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag des Releases, z. B. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Packen geändert?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packaging:
              - scripts/package-unsigned.sh
              - scripts/dmg/**
              - .github/workflows/release-build.yml

  build:
    name: Release-Build (Apple Silicon)
    needs: changes
    # Auf normalen PRs übersprungen; ein übersprungener Job gilt als bestandener Pflicht-Check.
    # !cancelled(): bei Releases ist "changes" übersprungen, der Build soll trotzdem laufen.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        startsWith(github.head_ref, 'release-please--') ||
        needs.changes.outputs.packaging == 'true'
      )
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # Build-Provenienz (Sigstore)
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}
          fetch-depth: 0 # build number = commit count

      - name: Xcode wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Werkzeuge installieren
        run: |
          brew install xcodegen
          command -v pipx >/dev/null || brew install pipx
          pipx install dmgbuild==1.6.7

      - name: Version bestimmen
        id: version
        run: |
          if [ -n "${TAG}" ]; then
            version="${TAG#v}"
          else
            # Release-PR: release-please hat die neue Version schon in project.yml eingetragen.
            version="$(sed -n 's/.*MARKETING_VERSION: *\([0-9][0-9.]*\).*/\1/p' project.yml)"
          fi
          [ -n "${version}" ] || { echo "Version nicht gefunden" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Bauen und packen
        run: scripts/package-unsigned.sh "${{ steps.version.outputs.version }}"

      - name: Artefakt ablegen
        uses: actions/upload-artifact@v7
        with:
          name: Takt-${{ steps.version.outputs.version }}-arm64
          path: build/unsigned/dist/
          retention-days: 14

      # Nur für Releases: belegt, dass DMG und ZIP aus diesem Repo und Workflow stammen.
      # Prüfen mit: gh attestation verify <datei> --repo nimble-123/takt
      - name: Build-Provenienz attestieren
        if: env.TAG != ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            build/unsigned/dist/*.dmg
            build/unsigned/dist/*.zip

      - name: An das Release hängen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${TAG}" build/unsigned/dist/* --clobber
          notes="$(gh release view "${TAG}" --json body --jq .body)"
          if ! grep -q "takt-unsigned-note" <<< "${notes}"; then
            cat > note.md <<'EOF'
          <!-- takt-unsigned-note -->
          ### Installation (Apple Silicon, unsigniert)

          `Takt-*-arm64.dmg` öffnen und Takt nach „Programme“ ziehen. Der Build ist nicht signiert und nicht notarisiert, deshalb blockiert macOS den ersten Start: unter **Systemeinstellungen → Datenschutz & Sicherheit** auf **Trotzdem öffnen** klicken oder `xattr -dr com.apple.quarantine /Applications/Takt.app` ausführen. Nach jedem Update fragt macOS erneut nach dem Zugriff auf den Schlüsselbund.

          Herkunft prüfen: `gh attestation verify Takt-*-arm64.dmg --repo nimble-123/takt`
          EOF
            printf '%s\n\n%s\n' "${notes}" "$(cat note.md)" > notes.md
            gh release edit "${TAG}" --notes-file notes.md
          fi

  homebrew:
    name: Homebrew-Tap
    needs: build
    # Nur für veröffentlichte Releases, nie auf PRs. Der Status von "build" wird ausdrücklich
    # geprüft, weil der übersprungene Job "changes" sonst die ganze Kette überspringen ließe.
    if: >-
      !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Ohne Token warnen statt scheitern: ein fehlendes Secret ist eine Einstellung,
      # kein kaputtes Release (siehe docs/RELEASING.md).
      - name: Tap-Token vorhanden?
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN fehlt - der Cask in nimble-123/homebrew-tap zeigt weiter auf das vorige Release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          repository: nimble-123/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Nur die beiden Zeilen, die sich pro Release ändern, werden neu geschrieben.
      - name: Cask auf die neue DMG zeigen lassen
        if: steps.token.outputs.present == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          dmg="Takt-${version}-arm64.dmg"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "${dmg}" "https://github.com/${REPO}/releases/download/${TAG}/${dmg}"
          sha="$(sha256sum "${dmg}" | cut -d' ' -f1)"
          rm "${dmg}"
          sed -i "s|^  version \".*\"$|  version \"${version}\"|" Casks/takt.rb
          sed -i "s|^  sha256 \".*\"$|  sha256 \"${sha}\"|" Casks/takt.rb
          # Ein sed ohne Treffer ließe den Cask still auf dem alten Build; deshalb zurücklesen.
          grep -qxF "  version \"${version}\"" Casks/takt.rb
          grep -qxF "  sha256 \"${sha}\"" Casks/takt.rb

      - name: Committen, falls sich etwas geändert hat
        if: steps.token.outputs.present == 'true'
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: takt ${TAG}" Casks/takt.rb
          git push
