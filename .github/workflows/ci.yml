name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS · Lint, Tests, App-Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode wählen
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Werkzeuge anzeigen
        id: tools
        run: |
          xcodebuild -version
          swift --version
          # Caches are only valid for the toolchain that built them.
          echo "xcode=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache für Formatierwerkzeuge
        uses: actions/cache@v6
        with:
          path: BuildTools/.build
          key: buildtools-${{ hashFiles('BuildTools/Package.resolved', 'BuildTools/Package.swift') }}

      - name: Lint (SwiftFormat, SwiftLint)
        run: scripts/format.sh --lint

      - name: SwiftPM-Cache
        if: hashFiles('Packages/TaktKit/Package.swift') != ''
        uses: actions/cache@v6
        with:
          path: Packages/TaktKit/.build
          key: spm-macos-${{ steps.tools.outputs.xcode }}-${{ hashFiles('Packages/TaktKit/Package.resolved', 'Packages/TaktKit/Package.swift') }}
          restore-keys: spm-macos-${{ steps.tools.outputs.xcode }}-

      - name: Package-Tests
        if: hashFiles('Packages/TaktKit/Package.swift') != ''
        run: swift test --package-path Packages/TaktKit --parallel

      - name: XcodeGen installieren
        if: hashFiles('project.yml') != ''
        run: brew install xcodegen

      - name: App bauen
        if: hashFiles('project.yml') != ''
        run: |
          xcodegen generate
          xcodebuild \
            -project Takt.xcodeproj \
            -scheme Takt \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  linux:
    name: Linux · Core-, Store- und Analytics-Tests
    # Hält TaktCore und TaktStore frei von Apple-only-Frameworks (siehe CLAUDE.md).
    # Package.swift deklariert Apple-only-Targets nur unter macOS, damit der Build hier gelingt.
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: SQLite-Header installieren
        if: hashFiles('Packages/TaktKit/Package.swift') != ''
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: SwiftPM-Cache
        if: hashFiles('Packages/TaktKit/Package.swift') != ''
        uses: actions/cache@v6
        with:
          path: Packages/TaktKit/.build
          key: spm-linux-swift6.2-${{ hashFiles('Packages/TaktKit/Package.resolved', 'Packages/TaktKit/Package.swift') }}
          restore-keys: spm-linux-swift6.2-
      - name: Tests (TaktCore, TaktStore, TaktAnalytics)
        if: hashFiles('Packages/TaktKit/Package.swift') != ''
        run: swift test --package-path Packages/TaktKit --filter 'TaktCoreTests|TaktStoreTests|TaktAnalyticsTests'
